# Include inside the existing HTTPS server; the normal Mautic firewall still
# authorizes every request. The Go HTTP API remains private on loopback.
location ~ ^/s/whatsqr/connections/[0-9]+/pair/events$ {
    include fastcgi_params;
    include forge_fastcgi_defaults;
    fastcgi_pass unix:/run/php/whatsqr-sse.sock;
    fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param DOCUMENT_ROOT $realpath_root;
    fastcgi_read_timeout 35s;
    fastcgi_buffering off;
    gzip off;
}
