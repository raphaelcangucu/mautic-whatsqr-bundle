; Adapt PHP version and user to the installation. Copy required private env
; settings on the server; never include their values in the plugin repository.
[whatsqr_sse]
user = forge
group = forge
listen = /run/php/whatsqr-sse.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 10s
pm.max_requests = 100
request_terminate_timeout = 35s
php_admin_value[memory_limit] = 128M
