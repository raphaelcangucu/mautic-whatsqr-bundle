mautic.whatsqr.exit.ambiguous.title="Este número tem duas credenciais no serviço, e ele se recusa a escolher uma."
mautic.whatsqr.exit.ambiguous.body="Escolher abriria a errada em metade das vezes, calada. A saída é apagar a sessão e parear de novo: abra Parear neste número e use Gerar outro código, ou chame quem cuida do servidor para rodar DELETE /sessions do id desta sessão. Enquanto isso, as respostas continuam entrando na fila e não saem."
mautic.whatsqr.exit.logged_out.title="O WhatsApp desfez o pareamento deste número."
mautic.whatsqr.exit.logged_out.body="Só um scan novo resolve — e tem que ser no mesmo celular, o do chip %jid%. As respostas que estão na fila saem quando ele voltar, e expiram em duas horas."

mautic.whatsqr.note.scope.title="O que esta tela não faz"
mautic.whatsqr.note.scope.body="Não configura campanha. Um número por QR Code entra na caixa de atendimento; o disparo por campanha é a segunda etapa e vai ter tela própria, com limite de velocidade explícito."
mautic.whatsqr.note.queue.title="Por que “na fila” é uma coluna"
mautic.whatsqr.note.queue.body="Quando a sessão cai, as respostas do atendente continuam entrando na fila e ficam paradas. Sem esse número aqui, ninguém descobre que três clientes estão esperando."

mautic.whatsqr.pair.title="Parear um número"
mautic.whatsqr.pair.qr_alt="Código QR de pareamento do WhatsApp"
mautic.whatsqr.pair.reason="O que o serviço respondeu:"
mautic.whatsqr.pair.stage.waiting="1 · Esperando"
mautic.whatsqr.pair.stage.connected="2 · Conectou"
mautic.whatsqr.pair.stage.not_done="3 · Não deu"

mautic.whatsqr.pair.waiting.title="Abra o WhatsApp no aparelho"
mautic.whatsqr.pair.waiting.body="Ajustes → Aparelhos conectados → Conectar aparelho, e aponte para este código."

mautic.whatsqr.pair.connected.body="O número já recebe. As conversas entram na mesma caixa dos canais oficiais."
mautic.whatsqr.pair.connected.note="O aparelho precisa ficar com internet. Se ele passar catorze dias fora do ar, o WhatsApp desfaz o pareamento sozinho."

mautic.whatsqr.pair.cause.expired.title="O código expirou"
mautic.whatsqr.pair.cause.expired.body="Ninguém escaneou a tempo. Nada foi criado — é só gerar outro."
mautic.whatsqr.pair.cause.expired.exit=""
mautic.whatsqr.pair.cause.unpaired.title="O WhatsApp desfez o pareamento"
mautic.whatsqr.pair.cause.unpaired.body="Escaneie de novo no mesmo celular, o do chip %jid%. Um aparelho diferente é recusado, e nesse caso o caminho é criar outro número."
mautic.whatsqr.pair.cause.unpaired.exit=""
mautic.whatsqr.pair.cause.refused.title="O WhatsApp recusou"
mautic.whatsqr.pair.cause.refused.body="Isto não passa tentando de novo, e por isso não há botão aqui: gerar outro código repetiria a mesma recusa."
mautic.whatsqr.pair.cause.refused.exit="Leia o motivo acima antes de qualquer outra coisa. Versão do cliente recusada e sessão assumida por outro aparelho se resolvem no servidor, não nesta tela; banimento não se resolve em lugar nenhum, e o caminho é atender por outro número."
mautic.whatsqr.pair.cause.ambiguous_credential.title="Há duas credenciais para este número"
mautic.whatsqr.pair.cause.ambiguous_credential.body="O serviço se recusa a escolher uma, porque escolher abriria a errada em metade das vezes, calada."
mautic.whatsqr.pair.cause.ambiguous_credential.exit="A saída é apagar a sessão no serviço — DELETE /sessions do id desta sessão — e parear de novo depois. Gerar outro código não apaga nenhuma das duas credenciais, e por isso o botão não está aqui."
mautic.whatsqr.pair.cause.service_down.title="O serviço não respondeu"
mautic.whatsqr.pair.cause.service_down.body="Não é o WhatsApp recusando nada: o processo que mantém as sessões não atendeu. Tente de novo quando ele voltar."
mautic.whatsqr.pair.cause.service_down.exit=""
