mautic.whatsqr.pair.ready.body="Gere o QR code quando estiver com o celular em mãos."
mautic.whatsqr.pair.waiting.note="O QR code é atualizado automaticamente. Mantenha esta página aberta durante a leitura."
mautic.whatsqr.restart.refused="Esta sessão não pode ser reiniciada aqui. Verifique primeiro o estado da conexão."
mautic.whatsqr.refresh.error="Não foi possível atualizar a conexão. Tentaremos novamente automaticamente."
mautic.whatsqr.steps.title="Conecte em três passos"
mautic.whatsqr.steps.one="Clique em Conectar WhatsApp para gerar o QR code."
mautic.whatsqr.steps.two="No celular, abra WhatsApp → Configurações → Aparelhos conectados → Conectar aparelho."
mautic.whatsqr.steps.three="Leia o código e aguarde a confirmação de conexão nesta tela."
mautic.whatsqr.integration.title="Conversas no Inbox compartilhado"
mautic.whatsqr.integration.body="As mensagens recebidas ficam no mesmo atendimento de WhatsApp Business, Instagram, Facebook e Web Chat."
mautic.whatsqr.integration.scope="Esta primeira versão permite respostas de texto. Mídias recebidas são identificadas, mas ainda não têm preview."
