mautic.whatsqr.integration.body="Incoming messages join WhatsApp Business, Instagram, Facebook and Web Chat in the same support inbox."
mautic.whatsqr.integration.scope="This first version supports text replies. Incoming media is identified, but previews are not supported yet."
