mautic.whatsqr.exit.ambiguous.title="This number has two credentials on the service, and it refuses to pick one."
mautic.whatsqr.exit.ambiguous.body="Picking would open the wrong one half the time, silently. The way out is to delete the session and pair again: open Pair on this number and use Generate another code, or ask whoever runs the server to DELETE /sessions for this session id. Meanwhile replies keep entering the queue and never leave."
mautic.whatsqr.exit.logged_out.title="WhatsApp undid this number's pairing."
mautic.whatsqr.exit.logged_out.body="Only a fresh scan fixes it — and it has to be the same phone, the one holding %jid%. Queued replies leave when it returns, and expire after two hours."

mautic.whatsqr.note.scope.title="What this screen does not do"
mautic.whatsqr.note.scope.body="It does not configure campaigns. A QR code number lands in the service inbox; campaign sending is stage two and gets its own screen, with an explicit rate limit."
mautic.whatsqr.note.queue.title="Why 'queued' is a column"
mautic.whatsqr.note.queue.body="When the session drops, the agent's replies keep entering the queue and sit there. Without this number here, nobody finds out that three customers are waiting."

mautic.whatsqr.pair.title="Pair a number"
mautic.whatsqr.pair.qr_alt="WhatsApp pairing QR code"
mautic.whatsqr.pair.reason="What the service answered:"
mautic.whatsqr.pair.stage.waiting="1 · Waiting"
mautic.whatsqr.pair.stage.connected="2 · Connected"
mautic.whatsqr.pair.stage.not_done="3 · Did not work"

mautic.whatsqr.pair.waiting.title="Open WhatsApp on the phone"
mautic.whatsqr.pair.waiting.body="Settings → Linked devices → Link a device, and point it at this code."

mautic.whatsqr.pair.connected.body="The number already receives. Conversations land in the same inbox as the official channels."
mautic.whatsqr.pair.connected.note="The phone needs to stay online. If it spends fourteen days offline, WhatsApp undoes the pairing on its own."

mautic.whatsqr.pair.cause.expired.title="The code expired"
mautic.whatsqr.pair.cause.expired.body="Nobody scanned it in time. Nothing was created — just generate another."
mautic.whatsqr.pair.cause.expired.exit=""
mautic.whatsqr.pair.cause.unpaired.title="WhatsApp undid the pairing"
mautic.whatsqr.pair.cause.unpaired.body="Scan again on the same phone, the one holding %jid%. A different device is refused, and then the way forward is a new number."
mautic.whatsqr.pair.cause.unpaired.exit=""
mautic.whatsqr.pair.cause.refused.title="WhatsApp refused"
mautic.whatsqr.pair.cause.refused.body="Trying again does not fix this, which is why there is no button here: another code would repeat the same refusal."
mautic.whatsqr.pair.cause.refused.exit="Read the reason above first. A rejected client version or a session taken over by another device are fixed on the server, not on this screen; a ban is not fixed anywhere, and the way forward is another number."
mautic.whatsqr.pair.cause.ambiguous_credential.title="There are two credentials for this number"
mautic.whatsqr.pair.cause.ambiguous_credential.body="The service refuses to pick one, because picking would open the wrong one half the time, silently."
mautic.whatsqr.pair.cause.ambiguous_credential.exit="The way out is to delete the session on the service — DELETE /sessions for this session id — and pair again afterwards. Generating another code erases neither credential, which is why the button is not here."
mautic.whatsqr.pair.cause.service_down.title="The service did not answer"
mautic.whatsqr.pair.cause.service_down.body="This is not WhatsApp refusing anything: the process that keeps the sessions did not respond. Try again when it is back."
mautic.whatsqr.pair.cause.service_down.exit=""
